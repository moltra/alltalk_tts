version: '3.8'

services:
  alltalk-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DOCKER_REPOSITORY: erew123/
        DOCKER_TAG: latest
        TTS_MODEL: xtts
    image: alltalk_tts:dev
    container_name: alltalk-dev
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "7855:7851"  # External:Internal - API
      - "7856:7852"  # External:Internal - Gradio UI
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Mount local code for live development
      - .:/home/alltalk
      # Persist models and outputs
      - ./models:/home/alltalk/models
      - ./outputs:/home/alltalk/outputs
      # Persist pip cache for faster rebuilds
      - pip_cache:/home/alltalk/pip_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /home/alltalk

volumes:
  pip_cache:
