version: '3.8'

services:
  alltalk-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        DOCKER_REPOSITORY: erew123/
        DOCKER_TAG: latest
        TTS_MODEL: xtts
    image: alltalk_tts:dev
    container_name: alltalk-dev
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "7855:7851"  # External:Internal - API
      - "7856:7852"  # External:Internal - Gradio UI
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Mount only specific files/directories to preserve container environment
      # Main application files
      - ./tts_server.py:/home/alltalk/tts_server.py
      - ./script.py:/home/alltalk/script.py
      - ./start_dev.sh:/home/alltalk/start_dev.sh
      # Config directory (centralized configs)
      - ./config:/home/alltalk/config
      # System directory (refactored code)
      - ./system:/home/alltalk/system
      # Models and outputs (persistent data)
      - ./models:/home/alltalk/models
      - ./outputs:/home/alltalk/outputs
      - ./voices:/home/alltalk/voices
      # Optional: mount other code directories as needed
      # - ./scripts:/home/alltalk/scripts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /home/alltalk

volumes:
  pip_cache:
