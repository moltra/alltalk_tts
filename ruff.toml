# Ruff Configuration for AllTalk TTS
# https://docs.astral.sh/ruff/configuration

line-length = 120
target-version = "py311"

[format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-use-pathlib
    "PERF",   # perflint
    "FURB",   # refurb
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "SIM108", # use ternary operator (sometimes less readable)
    "TCH001", # write type comments (not needed with type hints)
    "TCH002", # move third-party import into type-checking block
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert allowed in tests
    "ARG001", # unused function arguments in tests
    "PLR2004", # magic value comparison in tests
]
"__init__.py" = [
    "F401",   # unused imports (typical for __init__.py)
]

[lint.isort]
known-first-party = ["config", "tts_server", "tts_mem", "script", "finetune", "diagnostics"]
known-third-party = ["gradio", "fastapi", "uvicorn", "pydantic", "torch"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.pyupgrade]
keep-runtime-typing = true

[lint.pycodestyle]
max-doc-length = 100

[lint.pylint]
max-args = 10
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
